<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quadro de Horários</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    select {
      margin-bottom: 15px;
      padding: 5px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #0b3d91;
      color: white;
    }
    .card {
      background: #e6f0ff;
      padding: 5px;
      border-radius: 6px;
      margin: 2px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>

<h1>Quadro de Horários</h1>

<label>Filtrar por sala:</label> <select id="filtroSala">

  <option value="">Todas</option>
</select>

<table id="tabela">
  <thead>
    <tr>
      <th>Horário</th>
      <th>Segunda</th>
      <th>Terça</th>
      <th>Quarta</th>
      <th>Quinta</th>
      <th>Sexta</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// 🔗 COLE AQUI O LINK CSV
const URL = "COLE_AQUI_SEU_CSV";

async function carregarDados() {
  const res = await fetch(URL);
  const texto = await res.text();
  const linhas = texto.split("\n").map(l => l.split(","));

  const header = linhas[0];
  const dados = linhas.slice(1);

  // Esperado:
  // Horário | Dia | Sala | Disciplina | Professor

  const horarios = [...new Set(dados.map(l => l[0]))];
  const dias = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];

  const tabela = document.querySelector("#tabela tbody");
  tabela.innerHTML = "";

  const salas = new Set();

  dados.forEach(l => salas.add(l[2]));
  const select = document.getElementById("filtroSala");

  salas.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    select.appendChild(opt);
  });

  function render() {
    tabela.innerHTML = "";
    const filtro = select.value;

    horarios.forEach(h => {
      const tr = document.createElement("tr");
      const tdHora = document.createElement("td");
      tdHora.textContent = h;
      tr.appendChild(tdHora);

      dias.forEach(d => {
        const td = document.createElement("td");

        dados
          .filter(l =>
            l[0] === h &&
            l[1] === d &&
            (!filtro || l[2] === filtro)
          )
          .forEach(l => {
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
              <strong>${l[3]}</strong><br>
              ${l[4]}<br>
              Sala: ${l[2]}
            `;
            td.appendChild(div);
          });

        tr.appendChild(td);
      });

      tabela.appendChild(tr);
    });
  }

  select.addEventListener("change", render);
  render();
}

carregarDados();
</script>

</body>
</html>
